apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nginx-gateway-fabric
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/nginx-gateway-fabric/resources
  prune: true              
  wait: true
  targetNamespace: nginx-gateway
  dependsOn:
    - name: metallb-config                   