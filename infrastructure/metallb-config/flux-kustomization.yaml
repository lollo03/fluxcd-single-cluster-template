apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metallb-config
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/metallb-config/resources
  prune: true              
  wait: true
  targetNamespace: metallb-system
  dependsOn:
    - name: metallb    