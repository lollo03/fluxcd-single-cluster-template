apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: echo-server
spec:
  interval: 30m0s
  path: ./apps/echo-server/resources
  prune: true
  retryInterval: 2m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 3m0s
  wait: true
  targetNamespace: echo-server
  dependsOn:
    - name: nginx-gateway-fabric                   